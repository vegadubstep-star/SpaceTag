name: Build Space Tag Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test parsing and WAV safety
        run: python -m unittest discover -s tests -v
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SpaceTag source/spacetag.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "SpaceTag.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: SpaceTag-Windows-Installer
          path: dist/SpaceTag-Setup-0.1.0.exe
          if-no-files-found: error
      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: SpaceTag-Portable-EXE
          path: dist/SpaceTag.exe
          if-no-files-found: error
